[project]
name = "gmr-pix-golpe"
version = "0.1.0"
description = "Fine-tuning do Laya (System 1) para detecção de golpe do Pix"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "laya[onnx]>=0.3.21",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN202"]
